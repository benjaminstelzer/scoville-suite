# User-editable native Codex model choices and context thresholds.
schema_version = 1

[context]
# Coordinator: at or above; workers: strictly above. Percent of context window.
coordinator_percent = 33
worker_percent = 66

[coordinator]
model = "gpt-6-sol"
reasoning = "medium"
title = "SCW COORD"

[execute.ultra_low]
model = "gpt-6-sol"
reasoning = "low"

[review.ultra_low]
model = "gpt-6-sol"
reasoning = "medium"

[execute.low]
model = "gpt-6-sol"
reasoning = "medium"

[review.low]
model = "gpt-6-sol"
reasoning = "high"

[execute.medium]
model = "gpt-6-sol"
reasoning = "high"

[review.medium]
model = "gpt-6-sol"
reasoning = "xhigh"

[execute.high]
model = "gpt-6-sol"
reasoning = "xhigh"

[review.high]
model = "gpt-6-astra"
reasoning = "high"

[execute.ultra_high]
model = "gpt-6-astra"
reasoning = "high"

[review.ultra_high]
model = "gpt-6-astra"
reasoning = "xhigh"

# Build defaults; each installed Skill owns its independently editable copy.
# Starting assignments, not a measured capability ranking. Other IDs use medium.
[prompting]
profile = "auto"

[prompting.models]
"gpt-6-luna" = "low"
"gemini-3.8-flash-high" = "low"
"gpt-6-astra" = "high"
"claude-fable-5-1" = "high"
"claude-opus-5-5" = "high"
